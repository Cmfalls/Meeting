<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slide 2 — Title</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1e343d;
    --red: #a62b25;
    --cream: #f8f5ef;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Jost', sans-serif;
  }
  .slide {
    width: 1080px;
    height: 1350px;
    background: var(--navy);
    color: var(--cream);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 80px;
  }
  .slide::after {
    content: '';
    position: absolute;
    top: -200px;
    right: -200px;
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, rgba(166, 43, 37, 0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .eyebrow {
    display: flex;
    align-items: center;
    gap: 18px;
    z-index: 2;
  }
  .eyebrow .line {
    width: 60px;
    height: 2px;
    background: var(--red);
  }
  .eyebrow .label {
    font-family: 'Futura', 'Futura PT', 'ITC Avant Garde Gothic', 'Century Gothic', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.32em;
    color: var(--cream);
  }
  .star-circle {
    position: absolute;
    top: 200px;
    right: 80px;
    width: 240px;
    height: 240px;
    opacity: 0.95;
    z-index: 2;
  }
  .body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    z-index: 2;
    margin-top: 60px;
  }
  .headline {
    font-family: 'Futura', 'Futura PT', 'ITC Avant Garde Gothic', 'Century Gothic', sans-serif;
    font-weight: 700;
    font-size: 132px;
    line-height: 0.93;
    letter-spacing: -0.02em;
    color: var(--cream);
    text-transform: uppercase;
  }
  .headline .accent { color: var(--red); }
  .headline .small {
    font-size: 92px;
    display: block;
    margin-top: 10px;
  }
  .sub {
    margin-top: 60px;
    font-family: 'Jost', sans-serif;
    font-weight: 400;
    font-size: 30px;
    line-height: 1.45;
    color: var(--cream);
    opacity: 0.78;
    max-width: 720px;
    letter-spacing: 0.01em;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    z-index: 2;
  }
  .brand {
    display: flex;
    align-items: center;
    line-height: 0;
  }
  .brand svg {
    width: 280px;
    height: auto;
    display: block;
  }
  .swipe {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: 'Jost', sans-serif;
    font-weight: 500;
    font-size: 18px;
    letter-spacing: 0.28em;
    color: var(--cream);
    opacity: 0.65;
    text-transform: uppercase;
  }
  .swipe .arrow {
    width: 28px;
    height: 2px;
    background: var(--cream);
    position: relative;
  }
  .swipe .arrow::after {
    content: '';
    position: absolute;
    right: 0;
    top: -4px;
    width: 10px;
    height: 10px;
    border-right: 2px solid var(--cream);
    border-top: 2px solid var(--cream);
    transform: rotate(45deg);
  }
</style>
</head>
<body>
<div class="slide">
  <div class="eyebrow">
    <span class="line"></span>
    <span class="label">AMERICA 250</span>
  </div>

  <div class="body">
    <h1 class="headline">
      250<br>
      <span class="small">Years Ago,</span>
      <span class="small"><span class="accent">13</span> Colonies</span>
      <span class="small">Became</span>
      <span class="small">One Nation.</span>
    </h1>
    <p class="sub">The countdown to America's 250th birthday begins. And it begins with the flag that started it all.</p>
